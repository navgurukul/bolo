<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bolo — print</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet" />
<style>
  /* ─── Print page setup ─────────────────────────────────────── */
  @page { size: A4 portrait; margin: 0; }

  html, body {
    margin: 0; padding: 0;
    background: #d9d4c8;
    color: #1f221d;
    font-family: 'Geist', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Universal animations are kept for on-screen preview, but print
     freezes them at their starting state (which is fine — the dot is
     red, the ring is sage). */
  @keyframes bolo-breathe   { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.85)} }
  @keyframes bolo-ring-pulse{ 0%,100%{transform:scale(1);opacity:.55} 50%{transform:scale(1.04);opacity:.85} }
  @keyframes bolo-fade-in   { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  @keyframes bolo-wave      { 0%,100%{transform:scaleY(.35)} 50%{transform:scaleY(1)} }

  /* ─── Pages ─────────────────────────────────────────────────── */
  .pages { display: block; }

  .page {
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    background: #f4f1e9;
    padding: 14mm 14mm 12mm;
    margin: 0 auto;
    page-break-after: always;
    break-after: page;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  /* ─── Cover ─────────────────────────────────────────────────── */
  .page.cover {
    background: #1f221d;
    color: #f4f1e9;
    padding: 0;
    justify-content: center;
    align-items: stretch;
  }
  .cover-inner {
    padding: 24mm;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .cover-eyebrow {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 11pt;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #d4e1d5;
  }
  .cover-wordmark {
    font-size: 180pt;
    line-height: .9;
    letter-spacing: -6pt;
    font-style: italic;
    margin: 0;
    color: #f4f1e9;
  }
  .cover-wordmark .dot { color: #6d9176; font-style: normal; }
  .cover-tagline {
    font-size: 28pt;
    font-style: italic;
    color: #d4e1d5;
    letter-spacing: -0.5pt;
  }
  .cover-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6mm 16mm;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10pt;
    color: #d4e1d5;
  }
  .cover-meta > div { display: flex; flex-direction: column; gap: 3mm; }
  .cover-meta .lbl {
    font-size: 8.5pt; letter-spacing: 1.5px; text-transform: uppercase;
    color: #797d72;
  }

  /* ─── Screen page ──────────────────────────────────────────── */
  .page-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 4mm;
    border-bottom: 1px solid rgba(31,34,29,0.18);
  }
  .page-section {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 9pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #797d72;
  }
  .page-title {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-size: 22pt;
    letter-spacing: -0.5pt;
    color: #1f221d;
    line-height: 1;
  }

  .phone-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Center phone (380x800 → scaled down by html-to-image-free) by
       transforming, so the phone shell renders sharp at native size and
       fills the page nicely. */
  }
  .phone-wrap > div {
    transform: scale(0.83);
    transform-origin: center;
  }

  .page-foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 4mm;
    border-top: 1px solid rgba(31,34,29,0.18);
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 8.5pt;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #797d72;
  }

  /* Don't paginate within a phone */
  .phone-wrap, .phone-wrap * { break-inside: avoid; page-break-inside: avoid; }

  /* On-screen preview: stack pages with a margin between so it's
     scrollable; print mode collapses it. */
  @media screen {
    body { padding: 16px 0; }
    .page { box-shadow: 0 8px 32px rgba(0,0,0,0.18); margin-bottom: 16px; }
  }

  @media print {
    @page { size: A4 portrait; margin: 0; }
    body { background: #f4f1e9; padding: 0; }
    .page { box-shadow: none; margin: 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="bolo-themes.jsx"></script>
<script type="text/babel" src="bolo-screens.jsx"></script>

<script type="text/babel" src="bolo-print.jsx"></script>
</body>
</html>
